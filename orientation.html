<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>看房照片朝向识别</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6fa;color:#222;padding:24px;line-height:1.6}
  .wrap{max-width:900px;margin:0 auto}
  h1{font-size:22px;color:#2d5a9e;margin-bottom:4px}
  .sub{color:#777;font-size:13px;margin-bottom:20px}
  .drop{border:2px dashed #a9bfe0;border-radius:12px;background:#fff;padding:40px 20px;text-align:center;cursor:pointer;transition:.15s}
  .drop:hover,.drop.over{border-color:#2d5a9e;background:#eef3fb}
  .drop b{color:#2d5a9e;font-size:16px}
  .drop p{color:#888;font-size:13px;margin-top:6px}
  .bar{display:flex;gap:10px;align-items:center;margin:16px 0 8px;flex-wrap:wrap}
  .bar button{background:#2d5a9e;color:#fff;border:0;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer}
  .bar button:disabled{background:#b8c4d8;cursor:default}
  .count{color:#777;font-size:13px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  th{background:#2d5a9e;color:#fff;padding:10px;font-size:13px;text-align:left}
  td{padding:10px;border-bottom:1px solid #eef1f6;font-size:13px;vertical-align:middle}
  tr:nth-child(even) td{background:#fafbfd}
  .thumb{width:56px;height:56px;object-fit:cover;border-radius:6px;background:#eee;display:block}
  .noimg{width:56px;height:56px;border-radius:6px;background:#eef1f6;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:11px}
  .dir{font-weight:700;color:#2d5a9e;font-size:15px}
  .deg{color:#666}
  .miss{color:#c0392b;font-weight:600}
  .arrow{display:inline-block;font-size:20px;color:#2d5a9e;transition:.2s}
  .note{margin-top:18px;background:#fff7e6;border:1px solid #ffe1a8;border-radius:8px;padding:12px 16px;font-size:12.5px;color:#8a6d3b}
  .note b{color:#8a6d3b}
  .foot{color:#aaa;font-size:11px;text-align:center;margin-top:20px}
  .conv{margin-top:14px;background:#fff;border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .conv-label{font-size:13px;color:#555}
  .conv input{width:150px;padding:7px 10px;border:1px solid #cdd6e5;border-radius:8px;font-size:14px}
  .conv-out{font-size:16px;font-weight:700;color:#2d5a9e}
</style>
</head>
<body>
<div class="wrap">
  <h1>看房照片朝向识别</h1>
  <p class="sub">把照片拖进来，或点击选择。全程在你电脑本地处理，<b>照片不会上传到任何网络</b>。</p>

  <div class="drop" id="drop">
    <b>拖照片到这里 · 或点击选择</b>
    <p>支持 JPG / HEIC，可一次选多张。从相册直接选原图（勿用截图或微信压缩图）。</p>
    <input type="file" id="file" accept="image/*,.heic,.HEIC,.jpg,.jpeg" multiple hidden>
  </div>

  <div class="conv">
    <span class="conv-label">角度换算（与 iPhone 指南针同一套规则）：</span>
    <input type="number" id="degIn" placeholder="输入角度，如 111" min="0" max="360">
    <span id="degOut" class="conv-out">—</span>
  </div>

  <div class="bar" id="bar" style="display:none">
    <button id="csv">导出 CSV（Excel 可开）</button>
    <span class="count" id="count"></span>
  </div>

  <table id="tbl" style="display:none">
    <thead><tr><th>照片</th><th>文件名</th><th>拍摄时间</th><th>朝向</th><th>角度</th><th>参考</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="note">
    小提示：<b>截图、微信/WhatsApp 压缩图不含方向数据</b>，这类会显示「无方向数据」，请改发相册原图。
    方向来自手机磁力计，室内钢结构可能有几度偏差，当参考、和现场判断相互印证即可。
  </div>
  <p class="foot">离线本地工具 · 无需安装 · 数据不出本机</p>
</div>

<script>
const DIRS8=["北 N","东北 NE","东 E","东南 SE","南 S","西南 SW","西 W","西北 NW"];
function toCompass(deg){return DIRS8[Math.round(deg/45)%8];}

function parseExif(ab){
  const dv=new DataView(ab), len=dv.byteLength;
  let tiff=-1, little=false;
  for(let i=0;i<len-4;i++){
    const b0=dv.getUint8(i),b1=dv.getUint8(i+1),b2=dv.getUint8(i+2),b3=dv.getUint8(i+3);
    if(b0===0x4D&&b1===0x4D&&b2===0x00&&b3===0x2A){tiff=i;little=false;break;}
    if(b0===0x49&&b1===0x49&&b2===0x2A&&b3===0x00){tiff=i;little=true;break;}
  }
  if(tiff<0) return {};
  function readIFD(off){
    const base=tiff+off, entries={};
    if(base+2>len) return entries;
    const n=dv.getUint16(base,little);
    for(let e=0;e<n;e++){
      const eo=base+2+e*12;
      if(eo+12>len) break;
      const tag=dv.getUint16(eo,little);
      entries[tag]={valOff:eo+8};
    }
    return entries;
  }
  const out={};
  try{
    const ifd0=readIFD(dv.getUint32(tiff+4,little));
    if(ifd0[0x8825]){
      const gps=readIFD(dv.getUint32(ifd0[0x8825].valOff,little));
      if(gps[0x0011]){
        const off=tiff+dv.getUint32(gps[0x0011].valOff,little);
        const num=dv.getUint32(off,little), den=dv.getUint32(off+4,little);
        out.dir = den? num/den : num;
      }
      if(gps[0x0010]){
        const c=String.fromCharCode(dv.getUint8(gps[0x0010].valOff));
        out.ref = c==='T'?'真北':(c==='M'?'磁北':c);
      }
    }
    if(ifd0[0x8769]){
      const ex=readIFD(dv.getUint32(ifd0[0x8769].valOff,little));
      if(ex[0x9003]){
        const off=tiff+dv.getUint32(ex[0x9003].valOff,little);
        let s=''; for(let i=0;i<19;i++) s+=String.fromCharCode(dv.getUint8(off+i));
        out.dt=s;
      }
    }
  }catch(e){}
  return out;
}

const drop=document.getElementById('drop'), fileIn=document.getElementById('file');
const rows=document.getElementById('rows'), tbl=document.getElementById('tbl');
const bar=document.getElementById('bar'), count=document.getElementById('count');
let results=[];

drop.onclick=()=>fileIn.click();
fileIn.onchange=e=>handle(e.target.files);
;['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
;['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>handle(e.dataTransfer.files));

function handle(files){
  results=[];
  rows.innerHTML='';
  const list=[...files].filter(f=>f.type.startsWith('image/')||/\.(jpe?g|heic)$/i.test(f.name));
  if(!list.length) return;
  let pending=list.length;
  list.forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{
      const info=parseExif(r.result);
      results.push({name:f.name, file:f, ...info});
      if(--pending===0) render();
    };
    r.readAsArrayBuffer(f);
  });
}

function render(){
  results.sort((a,b)=>(a.dt||'zzz').localeCompare(b.dt||'zzz'));
  rows.innerHTML='';
  results.forEach(r=>{
    const tr=document.createElement('tr');
    const url=URL.createObjectURL(r.file);
    const hasDir = r.dir!==undefined;
    const comp = hasDir? toCompass(r.dir):'';
    const arrow = hasDir? `<span class="arrow" style="transform:rotate(${r.dir}deg)">↑</span>`:'';
    tr.innerHTML=`
      <td><img class="thumb" src="${url}" onerror="this.outerHTML='<div class=noimg>HEIC</div>'"></td>
      <td>${r.name}</td>
      <td>${r.dt? r.dt.replace(/:/,'-').replace(/:/,'-') : '—'}</td>
      <td>${hasDir? `<span class="dir">${comp}</span> ${arrow}` : '<span class="miss">无方向数据</span>'}</td>
      <td class="deg">${hasDir? Math.round(r.dir)+'°':'—'}</td>
      <td>${r.ref||'—'}</td>`;
    rows.appendChild(tr);
  });
  tbl.style.display='table';
  bar.style.display='flex';
  const miss=results.filter(r=>r.dir===undefined).length;
  count.textContent=`共 ${results.length} 张` + (miss? `，其中 ${miss} 张无方向数据`:'');
}

const degIn=document.getElementById('degIn'), degOut=document.getElementById('degOut');
degIn.oninput=()=>{
  const v=parseFloat(degIn.value);
  if(isNaN(v)){degOut.textContent='—';return;}
  const d=((v%360)+360)%360;
  const c=toCompass(d);
  degOut.textContent=`${Math.round(d)}° → ${c.split(' ')[0]}（${c.split(' ')[1]}）`;
};

document.getElementById('csv').onclick=()=>{
  let csv='文件,拍摄时间,方位,角度,参考\n';
  results.forEach(r=>{
    const comp=r.dir!==undefined?toCompass(r.dir):'无方向数据';
    const ang=r.dir!==undefined?Math.round(r.dir)+'°':'';
    csv+=`"${r.name}","${r.dt||''}","${comp}","${ang}","${r.ref||''}"\n`;
  });
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='朝向汇总.csv';
  a.click();
};
</script>
</body>
</html>
